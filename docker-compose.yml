name: harbor-support

services:
  server:
    build: ./server
    env_file:
      - path: ./server/.env
        required: true
    environment:
      NODE_ENV: production
      PORT: "4000"
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
